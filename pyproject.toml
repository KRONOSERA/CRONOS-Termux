[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cronos-yt"
version = "3.0.1"
description = "CRONOS: animated, permission-aware media downloader for Android Termux"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "CRONOS contributors"}]
keywords = ["termux", "youtube", "yt-dlp", "rich", "android"]
dependencies = [
  "yt-dlp[default]>=2026.10.26",
  "yt-dlp-ejs",
  "rich>=13.7,<16",
  "questionary>=2.0,<3",
  "mutagen>=1.47,<2",
]

[project.scripts]
cronos = "cronos_yt.main:main"
cronos-yt = "cronos_yt.main:main"

[tool.setuptools.packages.find]
include = ["cronos_yt*"]

[tool.setuptools.package-data]
cronos_yt = ["requirements.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
